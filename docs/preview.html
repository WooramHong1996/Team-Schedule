<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>미리보기 · 팀 행사 일정</title>
<style>
  body{margin:0;background:#e5e7eb;font:14px system-ui,sans-serif;display:flex;justify-content:center;padding:24px 0 80px}
  .phone{width:390px;height:844px;border:0;border-radius:36px;box-shadow:0 0 0 10px #111827,0 20px 50px rgba(0,0,0,.3);background:#fff}
</style>
</head>
<body>
<!--
  디자인 미리보기 — 로그인 없이 가짜 데이터로 실제 화면(index.html)을 그대로 띄워요.
  ?as=member|admin|new|guest   누구로 볼지 (팀원 · 관리자 · 처음 로그인 · 로그인 전)
  ?theme=light|dark            밝게/어둡게 강제
  ?frame=phone                 휴대폰 크기(390×844) 틀 안에서 보기
  가짜 데이터: preview/seed.js   가짜 서버: preview/mock.js (테스트와 같이 씀)
  실제 DB에는 아무것도 저장되지 않아요. 새로고침하면 처음 상태로 돌아가요.
-->
<script>
(async () => {
  const q = new URLSearchParams(location.search);
  if (q.get("frame") === "phone") {
    q.delete("frame");
    const f = document.createElement("iframe"); f.className = "phone"; f.title = "휴대폰 크기 미리보기";
    f.src = "preview.html?" + q.toString(); document.body.appendChild(f);
    // 도구 막대는 바깥에
    window.__PREVIEW = { as: q.get("as") || "", theme: q.get("theme") || "", frame: "phone" };
    const s = document.createElement("script"); s.src = "preview/bar.js"; document.body.appendChild(s);
    return;
  }
  const P = { as: q.get("as") || "", theme: q.get("theme") || "", frame: "" };
  const html = await (await fetch("index.html", { cache: "no-store" })).text();
  const inject = '<script>window.__PREVIEW=' + JSON.stringify(P) + '<\/script>' +
    '<script src="preview/seed.js"><\/script><script src="preview/mock.js"><\/script><script src="preview/bar.js"><\/script>';
  const out = html.replace(/<script src="https:\/\/cdn\.jsdelivr\.net\/npm\/@supabase\/[^"]+"><\/script>/, inject)
                  .replace("<title>", "<title>[미리보기] ");
  if (out === html) { document.body.textContent = "index.html 에서 supabase 스크립트 줄을 찾지 못했어요. preview.html 의 바꾸기 규칙을 확인해 주세요."; return; }
  document.open(); document.write(out); document.close();
})();
</script>
</body>
</html>
